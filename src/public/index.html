<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BPSR-PSO</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="components/select/style.css" />
        <link rel="stylesheet" href="components/popup/style.css" />
        <link rel="stylesheet" href="components/button/style.css" />
        <link rel="stylesheet" href="components/hpBar/style.css" />
        <!-- <link rel="stylesheet" href="components/hotkeyInput/style.css" /> -->
        <link rel="stylesheet" href="styles/index.css" />
    </head>
    <body>
        <div id="app-wrapper">
            <div class="main-container">
                <div class="controls">
                    <div class="title-container">
                        <div id="serverStatus" class="status-indicator"></div>
                        <span class="app-title">BPSR-PSO</span>
                    </div>

                    <div class="no-drag-zone" id="control-tool" style="display: flex; gap: 8px">
                        <select id="sortSelect" name="sortSelect" title="Sorter" data-select-custom>
                            <option value="damage">Damage</option>
                            <option value="healing">Healing</option>
                            <option value="taken">Taken</option>
                            <option value="dps">DPS</option>
                            <option value="hps">HPS</option>
                        </select>

                        <div class="button-group">
                            <button data-button id="clearButton" onclick="clearData()" title="Clear Data">
                                <img class="icon-button" src="/assets/trash.svg" />
                            </button>

                            <button data-button id="pauseButton" onclick="togglePause()" title="Pause/Resume">
                                <img class="icon-button" src="/assets/player-pause.svg" />
                            </button>

                            <button
                                data-button
                                id="screenshotButton"
                                onclick="takeScreenshot()"
                                title="Take Screenshot"
                            >
                                <img class="icon-button" src="/assets/camera.svg" />
                            </button>

                            <div data-popup-trigger="setting">
                                <button data-button title="Settings">
                                    <img class="icon-button" src="/assets/settings.svg" />
                                </button>
                            </div>
                            <div data-popup-content="setting">
                                <div style="display: flex; gap: 8px; flex-direction: column">
                                    <div class="settings-option">
                                        <label for="opacitySlider">Background Opacity</label>
                                        <input
                                            type="range"
                                            id="opacitySlider"
                                            min="0"
                                            max="1"
                                            step="0.05"
                                            value="0.80"
                                        />
                                    </div>

                                    <div class="settings-option">
                                        <label for="filterSelect">Filter by Classes</label>
                                        <select id="filterSelect" name="filterSelect" data-select-custom multiple>
                                            <option data-img="/assets/frost_mage.png" value="Frost Mage">
                                                Frost Mage
                                            </option>
                                            <option data-img="/assets/heavy_guardian.png" value="Heavy Guardian">
                                                Heavy Guardian
                                            </option>
                                            <option data-img="/assets/marksman.png" value="Marksman">Marksman</option>
                                            <option data-img="/assets/shield_knight.png" value="Shield Knight">
                                                Shield Knight
                                            </option>
                                            <option data-img="/assets/soul_musician.png" value="Soul Musician">
                                                Soul Musician
                                            </option>
                                            <option data-img="/assets/stormblade.png" value="Stormblade">
                                                Storm Blade
                                            </option>
                                            <option data-img="/assets/verdant_oracle.png" value="Verdant Oracle">
                                                Verdant Oracle
                                            </option>
                                            <option data-img="/assets/wind_knight.png" value="Wind Knight">
                                                Wind Knight
                                            </option>
                                        </select>

                                        <!-- <label>Hotkey clear data</label>
                                        <input id="HkclearData" data-type-hotkey placeholder="Press keys…" /> -->
                                    </div>

                                    <div class="settings-option">
                                        <button
                                            data-button
                                            id="shortcutsButton"
                                            onclick="openShortcutsWindow()"
                                            title="Configure Shortcuts"
                                        >
                                            <span
                                                style="
                                                    display: flex;
                                                    align-items: center;
                                                    justify-content: center;
                                                    gap: 8px;
                                                "
                                            >
                                                <img
                                                    class="icon-button"
                                                    src="/assets/keyboard.svg"
                                                    style="width: 16px; height: 16px"
                                                />
                                                <span style="font-size: 13px; font-weight: 500"
                                                    >Configure Shortcuts</span
                                                >
                                            </span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <button data-button id="closeButton" onclick="closeClient()" title="Close Client">
                                <img class="icon-button" src="/assets/x.svg" />
                            </button>
                        </div>
                    </div>

                    <div class="no-drag-zone hidden" id="control-passthrough" style="display: flex; gap: 8px">
                        <span class="passthrough-title"> Passthrough Enabled </span>
                    </div>
                </div>

                <div id="columnsContainer" class="columns-container"></div>
            </div>
        </div>
        <script src="library/socket.io.min.js"></script>
        <script src="library/dom-to-image-more.min.js"></script>
        <script src="components/hpBar/index.js"></script>
        <script src="components/select/index.js"></script>
        <script src="components/popup/index.js"></script>
        <script src="services/takeScreenshot.js"></script>
        <script src="utils/debounce.js"></script>
        <script src="utils/rafScheduler.js"></script>
        <script src="utils/flashEffect.js"></script>
        <script src="script/index.js"></script>
    </body>
</html>
